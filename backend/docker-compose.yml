services:
  mysql-db:
    image: mysql:8.0
    container_name: drizzle-mysql-container_name
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: schooldatabase
      MYSQL_USER: micael123
      MYSQL_PASSWORD: dev123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
